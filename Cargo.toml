[workspace]
members = [
  "crates/mtm-contracts",
  "crates/mtm-core",
  "crates/mtm-native",
  "crates/mtm-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["MTM-reboot Contributors"]
repository = "https://github.com/I0amLK/MTM-reboot"

[workspace.dependencies]
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
shell-words = "1.1"
url = "2.5"
base64 = "0.22"
nix = { version = "0.30", features = ["fs", "process", "signal", "term"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
