[workspace]
members = [
  "crates/mtm-contracts",
  "crates/mtm-core",
  "crates/mtm-native",
  "crates/mtm-storage",
  "crates/mtm-gateway",
  "crates/mtm-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["MTM-reboot Contributors"]
repository = "https://github.com/I0amLK/MTM-reboot"

[workspace.dependencies]
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
shell-words = "1.1"
url = "2.5"
base64 = "0.22"
hmac = "0.12"
getrandom = "0.4"
nix = { version = "0.30", features = ["fs", "process", "signal", "term"] }
rusqlite = { version = "0.37", features = ["bundled"] }
time = { version = "0.3", features = ["formatting", "macros"] }
axum = "0.8"
http = "1.3"
serde_urlencoded = "0.7"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5", features = ["util"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
