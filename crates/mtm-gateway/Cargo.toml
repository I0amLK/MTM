[package]
name = "mtm-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
shadow-fixture = []

[dependencies]
axum.workspace = true
base64.workspace = true
getrandom.workspace = true
hmac.workspace = true
http.workspace = true
mtm-contracts = { version = "=0.4.0-preview.3", path = "../mtm-contracts" }
mtm-core = { version = "=0.4.0-preview.3", path = "../mtm-core" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
sha2.workspace = true
time.workspace = true
tokio.workspace = true
url.workspace = true

[dev-dependencies]
tempfile = "3.20"
tower.workspace = true

[lints]
workspace = true

[[bin]]
name = "mtm-gateway-shadow"
path = "src/bin/shadow.rs"
required-features = ["shadow-fixture"]

[[bin]]
name = "mtm-gateway-server"
path = "src/bin/server.rs"
